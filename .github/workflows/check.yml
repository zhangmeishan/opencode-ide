name: Check and build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: npm ci
      - name: Secret scan (tracked files)
        run: npm run lint:secrets
      - run: npm run check && npm test
      - run: npm run build
      - name: Chat routing and configuration regression tests
        working-directory: opencode-extension
        run: bun test src/test/sidebar-tabs.test.ts src/test/sidebar-session-routing.test.ts src/test/settings-form.test.ts src/test/settings-config.test.ts src/test/commands.test.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:prototype
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-ide-vsix
          path: artifacts/*.vsix
